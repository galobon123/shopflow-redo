<aside class="sf-summary max-w-none" aria-label="Resumen de compra">
    <h2>Resumen de compra</h2>

    <ng-content select="[checkoutItems]" />

    <dl>
        <div><dt>Productos ({{ itemCount() }})</dt><dd>{{ total() | ars }}</dd></div>
    </dl>

    <div class="sf-summary__total"><span>Total</span><strong>{{ total() | ars }}</strong></div>
    <p class="sf-summary__note">IVA incluido</p>

    <ng-content select="[actionButtons]" />
</aside>
