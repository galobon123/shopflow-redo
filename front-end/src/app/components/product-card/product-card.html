<article class="sf-card">
    <div class="sf-card__media">
        @if (product().imageUrl && !imageFailed()) {
            <img class="sf-card__photo" [src]="product().imageUrl" [alt]="product().name" loading="lazy" (error)="imageFailed.set(true)" />
        } @else {
            <span class="absolute inset-0 grid place-items-center p-4 text-center text-body-s text-ink-muted"><span class="line-clamp-4">{{ product().name }}</span></span>
        }
        <div class="sf-card__fav">
            <ng-content />
        </div>
    </div>

    <div class="sf-card__body">
        <h3 class="sf-card__name" [title]="product().name">{{ product().name }}</h3>
        <div class="sf-price-row">
            <span class="sf-price">{{ product().price | ars }}</span>
        </div>
    </div>

    <div class="sf-card__foot">
        <sf-stock-badge [stock]="product().stock" />
        <button sfButton="secondary" size="sm" type="button" [disabled]="product().stock <= 0" (click)="store.addToCart(product())">
            Agregar
        </button>
    </div>
</article>
