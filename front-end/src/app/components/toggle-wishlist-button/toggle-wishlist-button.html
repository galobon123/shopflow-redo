<button sfIconButton="float" type="button" class="sf-fav"
    [pressed]="isInWishlist()"
    [disabled]="saving()"
    [attr.aria-busy]="saving()"
    [attr.aria-label]="isInWishlist() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
    (click)="toggleWishlist()">
    <lucide-icon [img]="heartIcon" />
</button>
