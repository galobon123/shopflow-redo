@if (navigateTo(); as url) {
  <a sfButton="ghost" class="-ms-4" [routerLink]="url">
    <lucide-icon [img]="backIcon" />
    <ng-content />
  </a>
} @else {
  <button sfButton="ghost" class="-ms-4" type="button" (click)="goBack()">
    <lucide-icon [img]="backIcon" />
    <ng-content />
  </button>
}
