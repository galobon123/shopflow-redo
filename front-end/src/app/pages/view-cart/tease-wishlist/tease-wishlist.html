<div appViewPanel class="flex items-center justify-between">
    <div class="flex items-center gap-3">
        <mat-icon class="text-danger">favorite_border</mat-icon>
        <div>
            <h2 class="text-title">Wishlist ({{ store.wishListCount() }})</h2>
            <p class="text-ink-muted text-body-s">
                You have {{ store.wishListCount() }} items saved for later.
            </p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <button matButton routerLink="/wishlist">
            View All
        </button>
        <button matButton="filled" class="flex items-center gap-2" (click)="store.addAllWishlistToCart(store.wishListItems())">
            <mat-icon>shopping_cart</mat-icon>
            Add All to Cart
        </button>
    </div>
</div>
