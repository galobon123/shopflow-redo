<div appViewPanel class="flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
        <mat-icon class="text-danger" aria-hidden="true">favorite_border</mat-icon>
        <div>
            <h2 class="text-title">Favoritos ({{ store.wishListCount() }})</h2>
            <p class="text-ink-muted text-body-s">
                Tenés {{ store.wishListCount() }} {{ store.wishListCount() === 1 ? 'producto guardado' : 'productos guardados' }}.
            </p>
        </div>
    </div>
    <div class="flex flex-wrap items-center gap-3">
        <button matButton routerLink="/wishlist">
            Ver todos
        </button>
        <button matButton="filled" class="flex items-center gap-2" (click)="store.addAllWishlistToCart(store.wishListItems())">
            <mat-icon aria-hidden="true">shopping_cart</mat-icon>
            Agregar todos al carrito
        </button>
    </div>
</div>
