<div appViewPanel>
    <h2 class="font-display text-heading mb-4">
        Cart Items ({{ store.cartCount() }})
    </h2>
    <div class="flex flex-col gap-6">
        @for (item of store.cartItems(); track item.productId) {
            <app-show-cart-item [item]="item" />
        }
    </div>
</div>
