<div class="min-h-[calc(100vh-var(--header-height))] flex items-center justify-center px-4 py-12 bg-canvas">
  <div class="w-full max-w-md bg-surface rounded border border-line p-8">
    <h1 class="font-display text-heading">Ingresar</h1>
    <p class="text-body text-ink-muted mt-2 mb-8">Con el email y la contraseña de tu cuenta.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5" novalidate>
      @if (formError(); as message) {
        <sf-alert>{{ message }}</sf-alert>
      }

      <sf-field class="max-w-none" label="Email"
        [errors]="{ required: 'Ingresá tu email.', email: 'Revisá el email: falta algo como nombre@mail.com.' }">
        <input sfInput type="email" formControlName="email" autocomplete="username" inputmode="email" />
      </sf-field>

      <sf-field class="max-w-none" label="Contraseña" [errors]="{ required: 'Ingresá tu contraseña.' }">
        <input sfInput type="password" formControlName="password" autocomplete="current-password" />
      </sf-field>

      <button sfButton="primary" size="lg" block type="submit" [loading]="authStore.loading()">Ingresar</button>
    </form>

    <p class="text-body-s text-ink-muted mt-6 text-center">
      ¿No tenés cuenta?
      <a class="sf-link" routerLink="/register" queryParamsHandling="preserve">Crear cuenta</a>
    </p>
  </div>
</div>
