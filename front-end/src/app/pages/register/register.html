<div class="min-h-[calc(100vh-var(--header-height))] flex items-center justify-center px-4 py-12 bg-canvas">
  <div class="w-full max-w-md bg-surface rounded border border-line p-8">
    <h1 class="font-display text-heading">Crear cuenta</h1>
    <p class="text-body text-ink-muted mt-2 mb-8">Para comprar y seguir tus pedidos.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5" novalidate>
      <sf-field class="max-w-none" label="Nombre"
        [errors]="{ required: 'Ingresá tu nombre.', minlength: 'Tiene que tener al menos 2 letras.', maxlength: 'Máximo 100 caracteres.' }">
        <input sfInput type="text" formControlName="name" autocomplete="name" />
      </sf-field>

      <sf-field class="max-w-none" label="Email"
        [errors]="{ required: 'Ingresá tu email.', email: 'Revisá el email: falta algo como nombre@mail.com.' }">
        <input sfInput type="email" formControlName="email" autocomplete="email" inputmode="email" />
      </sf-field>

      <sf-field class="max-w-none" label="Contraseña" hint="Al menos 8 caracteres."
        [errors]="{ required: 'Elegí una contraseña.', minlength: 'Tiene que tener al menos 8 caracteres.', tooLong: 'Es demasiado larga. Probá con una más corta.' }">
        <input sfInput type="password" formControlName="password" autocomplete="new-password" />
      </sf-field>

      <button sfButton="primary" size="lg" block type="submit" [loading]="authStore.loading()">Crear cuenta</button>
    </form>

    <app-google-sign-in (signedIn)="goBack()" />

    <p class="text-body-s text-ink-muted mt-6 text-center">
      ¿Ya tenés cuenta?
      <a class="sf-link" routerLink="/login" queryParamsHandling="preserve">Ingresar</a>
    </p>
  </div>
</div>
