<div class="mx-auto max-w-page py-6">
    <app-back-button class="mb-4" navigateTo="/cart">
        Back to Cart
    </app-back-button>

    <h1 class="font-display text-display-l mb-4">Checkout</h1>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
        <div class="lg:col-span-3 flex flex-col gap-6">
            <app-shipping-form></app-shipping-form>
            <app-payment-form></app-payment-form>
        </div>
        <div class="lg:col-span-2">
            <app-summarize-order>

                <ng-container checkoutItems>
                    @for (item of store.cartItems(); track item.productId) {
                        <div class="text-body flex justify-between">
                            <span> {{ item.productName }} x {{ item.quantity }} </span>
                            <span> ${{ item.productPrice * item.quantity | number:'1.2-2' }} </span>
                        </div>
                    }
                </ng-container>

                <ng-container actionButtons>
                    @if (!authStore.emailVerified()) {
                        <sf-alert tone="info" class="mt-6">Confirmá tu email para comprar. El enlace está en tu bandeja de entrada.</sf-alert>
                    }
                    <button
                        matButton="filled"
                        class="w-full mt-6 py-3"
                        [disabled]="store.loading() || !authStore.emailVerified()"
                        (click)="placeOrder()"
                    >
                        {{ store.loading() ? 'Processing...' : 'Place Order'}}
                    </button>
                </ng-container>
            </app-summarize-order>
        </div>
    </div>
</div>
