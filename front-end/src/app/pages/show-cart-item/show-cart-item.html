<div class="grid grid-cols-3 grid-cols-[3fr_1fr_1fr]">
    <div class="flex items-center gap-4">
        <img [src]="item().productImageUrl" (error)="item().productImageUrl = 'https://i.pinimg.com/1200x/0d/84/16/0d8416d15a838293cabd8e13f91aadac.jpg'" class="w-24 h-24 object-cover rounded" [alt]="item().productName" />
        <div>
            <div class="text-ink text-body font-semibold"> {{ item().productName }}</div>
            <div class="text-ink-muted text-body"> ${{ item().productPrice | number:'1.2-2' }}</div>
        </div>
    </div>
    <sf-qty-stepper [value]="item().quantity" (valueChange)="store.updateCartQty(item().productId, $event)" />

    <div class="flex flex-col items-end">
        <div class="text-right font-semibold text-body">
            {{ total() }}
        </div>
        <div class="flex -me-3">
            <button matIconButton (click)="store.moveToWishlist(item())">
                <mat-icon>favorite_border</mat-icon>
            </button>
            <button matIconButton class="danger" (click)="store.removeFromCart(item().productId)">
                <mat-icon>delete</mat-icon>
            </button>

        </div>

    </div>
</div>
