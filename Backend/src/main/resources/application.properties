spring.application.name=Ecommerce

# Profiles: "dev" for local work, "prod" for deployments (SPRING_PROFILES_ACTIVE=prod).
spring.profiles.default=dev

# Local runs read the repo's .env (from Backend/ or from the repo root). Real environment variables win.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ── JWT ──────────────────────────────────────────
# Empty default so JwtService can fail with a clear message instead of a placeholder error.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ── Base de datos ──────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
# HU-19 · A paged query that fetches a collection fails instead of paging in memory (HHH90003004).
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false

# ── Admin inicial ──────────────────────────────────────────
# If both are set and the email doesn't exist yet, AdminBootstrap creates that admin on startup.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Admin}

# ── Email (HU-31, HU-33) ───────────────────────────────────
# Default: Mailpit from docker-compose (inbox at http://localhost:8025). In production, a real SMTP.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# A slow SMTP must not hold a sign-in for minutes.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:ShopFlow <no-reply@shopflow.local>}
# Base of the links in the emails (the store, not the API).
app.public-url=${PUBLIC_URL:http://localhost:4200}
# HU-20 · Cron of the worker that sends the queued emails (mail:queue): every 5 seconds.
app.mail.worker-cron=*/5 * * * * *

# ── Pagos con Mercado Pago (HU-18) ─────────────────────────
# Without MP_ACCESS_TOKEN the app still starts: paying answers 503 "El pago no está disponible" (see .env.example).
app.mercadopago.access-token=${MP_ACCESS_TOKEN:}
# Secret of the webhook (Tus integraciones → Webhooks): checks each notification's x-signature.
app.mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
# true: the checkout opens sandbox_init_point (test credentials and test buyers); false: init_point.
app.mercadopago.sandbox=${MP_SANDBOX:true}
# The tests point it at a fake server.
app.mercadopago.api-url=https://api.mercadopago.com
# Public URL of the API, for the preference's notification_url (<url>/api/payments/webhook). Empty: none is sent
# and Mercado Pago uses the webhook URL set in its panel. In Docker, set it to PUBLIC_URL (Nginx proxies /api).
app.api-public-url=${API_PUBLIC_URL:}
# Cron of the job that cancels the unpaid orders whose 30 minutes are up: every minute.
app.orders.expiry-cron=0 * * * * *

# ── Ingreso con Google (HU-32) ─────────────────────────────
# OAuth client id from Google Cloud Console. Empty: the Google button is hidden.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ── Health check (Docker/HU-04) ─────────────────────────────
# Only /actuator/health is public; it checks Postgres and Redis. Details stay hidden.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# The SMTP being down must not mark the backend unhealthy: the store works, only emails wait.
management.health.mail.enabled=false
# HU-14 · Neo4j neither: only recommendations use it, and the wishlist syncs to it when it's back.
management.health.neo4j.enabled=false

# ── Servidor ───────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
# Behind Nginx/Caddy the client IP comes in X-Forwarded-For. "native" uses Tomcat's RemoteIpValve,
# which reads the header from the right and trusts only internal proxies (private ranges), so a client
# can't fake its IP to dodge the login limit (HU-07).
server.forward-headers-strategy=native

# ── CORS ───────────────────────────────────────────────────
# Comma-separated list of origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ── Neo4j ───────────────────────────────────────────────────
spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USER}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
# HU-14 · Short waits: a Neo4j that doesn't answer fails fast and the wishlist sync goes to the retry list.
spring.neo4j.connection-timeout=3s
spring.neo4j.pool.connection-acquisition-timeout=5s
# Cron of the job that retries the pending syncs (neo4j:sync:pending): every minute.
app.neo4j-sync.retry-cron=0 * * * * *
# HU-15 · true: on startup, loads every product, wishlist and paid order from Postgres into Neo4j (GraphBackfill).
# Idempotent. Run once by hand: ./mvnw spring-boot:run -Dspring-boot.run.arguments=--app.neo4j.backfill=true
# (in Docker: APP_NEO4J_BACKFILL=true for one start).
app.neo4j.backfill=false

# ── Redis ───────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
