# HU-04 · Every PR (and every push to main) builds and tests backend, frontend and the Docker stack.
# Make the three jobs "required" in the branch protection of main so a red pipeline blocks the merge.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    # Integration tests start Postgres, Redis and Neo4j themselves with Testcontainers (HU-27).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify
      # HU-27 · Informational coverage: shown in the run summary, no minimum enforced.
      - name: Cobertura
        if: always()
        run: |
          awk -F, 'NR>1 { missed += $8; covered += $9 } END { if (missed + covered > 0) printf "### Backend: %.1f%% de líneas cubiertas\n", 100 * covered / (missed + covered) }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: Backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend · build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration production
      - name: Tests
        shell: bash
        run: npx ng test --watch=false --coverage --coverage-reporters=text-summary --coverage-reporters=html | tee test-output.txt
      # HU-27 · Informational coverage: shown in the run summary, no minimum enforced.
      - name: Cobertura
        if: always()
        run: |
          echo "### Frontend" >> "$GITHUB_STEP_SUMMARY"
          sed 's/\x1b\[[0-9;]*m//g' test-output.txt | grep -E "^(Statements|Branches|Functions|Lines)" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-frontend
          path: front-end/coverage/
          if-no-files-found: ignore

  docker:
    name: Docker · stack completo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: .env de CI
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^JWT_SECRET=.*|JWT_SECRET=ci-only-secret-that-is-at-least-32-bytes-long|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-password|" \
            -e "s|^NEO4J_PASSWORD=.*|NEO4J_PASSWORD=ci-password|" \
            .env
      # HU-04 · Escenario "Levantar todo el sistema": --wait fails unless every service turns healthy.
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: La tienda responde en http://localhost
        run: |
          curl -fsS http://localhost/ | grep -q "<app-root"
          curl -fsS http://localhost/api/products > /dev/null
      - name: Logs si algo falló
        if: failure()
        run: docker compose ps && docker compose logs --tail=100
